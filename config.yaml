app_name: PolyVITrade
environment: development

trading:
  max_risk_per_trade: 0.02
  max_daily_loss: 0.05
  max_consecutive_losses: 3
  confidence_threshold: 0.6
  market_open: "09:15"
  market_close: "15:30"

database:
  url: "sqlite:///ai_trader.db"
  echo: false
  pool_size: 5

logging:
  level: INFO
  format: json
  output_dir: ai_trader/logs

backtest:
  default_capital: 100000.0
  brokerage_rate: 0.0003
  stt_rate: 0.00025
  gst_rate: 0.18
  slippage_rate: 0.0001
  max_position_pct: 0.02

broker:
  name: paper  # "paper" or "angelone"
  api_key: ""
  api_secret: ""
  client_id: ""
  password: ""
  totp_secret: ""
  base_url: ""
  max_retries: 3
  retry_delay_s: 1.0
  product_type: INTRADAY
  exchange: NSE

approval:
  enabled: true
  timeout_s: 300.0
  auto_approve_paper: true  # bypasses approval in paper mode only

kill_switch:
  daily_loss_limit: 0.05
  max_api_failures: 5
